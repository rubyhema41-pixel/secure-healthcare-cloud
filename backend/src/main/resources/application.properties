# ---- MySQL (use AWS RDS endpoint in the cloud) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# ---- AWS S3 (credentials come from the EC2 IAM role or AWS env variables) ----
app.s3.bucket=${S3_BUCKET:my-ehr-encrypted-bucket}
app.s3.region=${AWS_REGION:ap-south-1}
# ---- Keys: 32 random bytes, base64. Generate with: openssl rand -base64 32 ----
app.master-key=${MASTER_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
app.index-key=${INDEX_KEY:BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=}
app.admin-password=${ADMIN_PASSWORD:admin123}
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}
